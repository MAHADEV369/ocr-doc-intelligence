[project]
name = "docintel-india"
version = "1.1.0"
description = "Self-hosted Indian corporate document intelligence and OCR benchmark"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E702", "E741"]
